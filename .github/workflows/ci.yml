name: Check

# Every push and pull request is formatted, type-checked, and compiled on Windows,
# so a change that would break the installer is caught before it reaches main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The reading-plan tests schedule the real text rather than a fixture, because the
      # whole reason to schedule by words is how uneven the real chapters are. The text
      # is generated rather than committed, so it is built here first.
      - name: Cache the downloaded datasets
        uses: actions/cache@v4
        with:
          path: data/raw
          key: datasets-${{ hashFiles('data/sources.json') }}

      - name: Build the Bible database
        run: npm run data:build

      - name: Formatting
        run: npm run format:check
      - name: Types
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build:web --workspace app

  desktop:
    name: Desktop build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci

      # Tauri's config declares the Bible database as a bundled resource, so the Rust
      # build refuses to start without it. Building it here also checks the data
      # pipeline on every push.
      - name: Cache the downloaded datasets
        uses: actions/cache@v4
        with:
          path: data/raw
          key: datasets-${{ hashFiles('data/sources.json') }}

      - name: Build the Bible database
        run: npm run data:build

      - name: Rust formatting
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: Rust lints
        working-directory: app/src-tauri
        run: cargo clippy -- -D warnings

      # Compiles the real Windows binary without packaging it. Building the installer
      # needs the updater signing key, which only a release has; see docs/releasing.md.
      - name: Compile the app
        working-directory: app/src-tauri
        run: cargo build --release
