[package]
name = "rhema"
version = "0.1.0"
description = "Read the Bible cover to cover and remember it"
edition = "2021"
rust-version = "1.77"

[lib]
name = "rhema_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
# A smaller, faster installer. Link-time optimisation costs build time, not run time.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
